name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xian-governance-web
        uses: actions/checkout@v7
        with:
          path: xian-governance-web

      - name: Checkout xian-js
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-js
          ref: 39ee606d475ea34790fb60199822ca705310bb00
          path: xian-js

      - name: Checkout compiler workspace dependency
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-contracting
          ref: d9875fc947168f114e70c77ca0b640c1948d03e9
          path: xian-contracting

      - name: Checkout workspace reporting tools
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-meta
          ref: 9d309fce2430a9b732d3a7fab7782a1fdd09fefd
          path: xian-meta

      - name: Report resolved sibling SHAs
        run: python3 xian-meta/scripts/report_workspace_shas.py --workspace-root .

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            xian-governance-web/package-lock.json
            xian-js/package-lock.json

      - name: Install xian-js dependencies
        working-directory: xian-js
        run: npm ci

      - name: Build xian-js packages
        working-directory: xian-js
        run: npm run build

      - name: Install dependencies
        working-directory: xian-governance-web
        run: npm ci

      - name: Validate
        working-directory: xian-governance-web
        run: npm run validate
