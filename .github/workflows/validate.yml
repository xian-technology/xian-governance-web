name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xian-governance-web
        uses: actions/checkout@v7
        with:
          path: xian-governance-web

      - name: Checkout xian-js
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-js
          ref: main
          path: xian-js

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            xian-governance-web/package-lock.json
            xian-js/package-lock.json

      - name: Install xian-js dependencies
        working-directory: xian-js
        run: npm ci

      - name: Build xian-js packages
        working-directory: xian-js
        run: npm run build

      - name: Install dependencies
        working-directory: xian-governance-web
        run: npm ci

      - name: Validate
        working-directory: xian-governance-web
        run: npm run validate
